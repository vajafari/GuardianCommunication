syntax = "proto3";
package guardian.controller;

// محتوای هر پیام JSON مدل ارتباطی همان کار است (پوشه GuardianController/Model)
enum GuardianControllerGrpcMessageType {
  // سرور → برد: GuardianControllerGrpcDeviceCommandModel
  send_command = 0;
  // برد → سرور: نتیجه دستور با همان message_id؛ error_code غیرصفر یعنی خطا با GuardianControllerErrorCommunicationModel
  response_command = 1;
  get_device_configs = 2;
  // برد → سرور: فهرست GuardianControllerDoorEventCommunicationModel
  device_event = 3;
  // برد → سرور: فهرست GuardianControllerAttendanceCommunicationModel
  device_attendance = 4;
  // برد → سرور: GuardianControllerAttendanceCommunicationModel؛ پاسخ آن GuardianControllerMatchOnServerResponseModel است
  match_on_server = 5;
  match_on_server_response = 6;
  heartbeat = 7;
  ack = 8;
  // برد → سرور: درخواست ساعت؛ پاسخ آن ack با GuardianControllerDateAndTimeCommunicationModel است
  sync_datetime = 9;
}

message GuardianControllerGrpcMessage {
  string device_serial_number = 1;
  string message_id = 2;
  GuardianControllerGrpcMessageType message_type = 3;
  string message_content = 4;
  int32 error_code = 5;
}

service GuardianControllerGrpcService {
  rpc Stream (stream GuardianControllerGrpcMessage) returns (stream GuardianControllerGrpcMessage);
}
